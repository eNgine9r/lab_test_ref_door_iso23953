<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Door Test Controller</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <section class="panel header">
      <h1 data-i18n="title">Door Test Controller</h1>
      <div class="right">
        <label data-i18n="lang">Language
          <select id="langSelect">
            <option value="uk">Українська</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
    </section>

    <section class="panel grid two">
      <div>
        <h2 data-i18n="params">Параметри</h2>
        <label data-i18n="showcase">Тип вітрини
          <select id="showcase_type">
            <option value="medium temperature">MT</option>
            <option value="low temperature">LT</option>
          </select>
        </label>
        <label data-i18n="door_count">Кількість дверей
          <input id="door_count" type="number" min="1" max="6" value="4">
        </label>
        <label data-i18n="open_time">Open time (s)
          <input id="open_time" type="number" step="0.1" value="2">
        </label>
        <label data-i18n="delay">Delay (s)
          <input id="delay_between_doors" type="number" step="0.1" value="1">
        </label>
        <label data-i18n="mode">Режим тесту
          <select id="test_mode">
            <option value="day" data-i18n="day">Day</option>
            <option value="night" data-i18n="night">Night</option>
          </select>
        </label>
      </div>

      <div>
        <h2 data-i18n="status">Статус</h2>
        <p><strong data-i18n="system_status">System status:</strong> <span id="status">-</span></p>
        <p><strong data-i18n="test">Test:</strong> <span id="running">-</span></p>
        <p><strong data-i18n="event">Last event:</strong> <span id="event">-</span></p>
        <p><strong data-i18n="error">Error:</strong> <span id="error">-</span></p>
        <p><strong data-i18n="light">Light relay:</strong> <span id="lightStatus">-</span></p>
        <p><strong>Modbus port:</strong> <span id="modbusPort">-</span></p>
        <p><strong>Modbus backend:</strong> <span id="modbusBackend">-</span></p>
      </div>
    </section>

    <section class="panel buttons">
      <button id="start" data-i18n="start">Start test</button>
      <button id="stop" data-i18n="stop">Stop test</button>
      <button id="reset" data-i18n="reset">Reset cycles</button>
      <button id="lightOn" data-i18n="light_on">Light ON</button>
      <button id="lightOff" data-i18n="light_off">Light OFF</button>
      <button data-door="1">Open door 1</button>
      <button data-door="2">Open door 2</button>
      <button data-door="3">Open door 3</button>
      <button data-door="4">Open door 4</button>
      <button data-door="5">Open door 5</button>
      <button data-door="6">Open door 6</button>
    </section>

    <section class="panel">
      <h2 data-i18n="doors">Door states</h2>
      <div id="doors" class="door-grid"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="cycles">Cycles</h2>
      <pre id="cyclesData">-</pre>
    </section>
  </main>

  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
